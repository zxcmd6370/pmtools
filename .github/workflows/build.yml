name: Build PmTools

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Publish
        run: dotnet publish src/PmToolsGui/PmToolsGui.csproj -c Release -r win-x64 --self-contained -o ./output

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PmTools-exe
          path: ./output/
